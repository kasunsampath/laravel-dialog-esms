name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Testbench must be pinned alongside Laravel, not left to float. Each
    # Testbench major targets exactly one Laravel major, so constraining only
    # illuminate/* lets Composer pick the newest Testbench and then fail with a
    # conflict against the Laravel version this job is meant to be testing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.3'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.4'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer require \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      # `composer show` takes at most one package name, so grep the full list
      # rather than passing several. `|| true` keeps a diagnostic step from
      # ever failing the build — the tests decide that, not the logging.
      - name: Show resolved versions
        run: composer show | grep -E 'laravel/framework|orchestra/testbench|phpunit/phpunit' || true

      - name: Run tests
        run: vendor/bin/phpunit
